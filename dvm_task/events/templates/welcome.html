{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0d0e12]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Plaza</title>
    
    <!-- Google Font: Yellowtail -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        yellowtail: ['Yellowtail', 'cursive'],
                    },
                    colors: {
                        plaza: {
                            gold: '#f5c542',
                            dark: '#0d0e12',
                            panel: '#151821'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 25px rgba(245, 197, 66, 0.15);
            }
            50% {
                box-shadow: 0 0 45px rgba(245, 197, 66, 0.35);
            }
        }

        .animate-intro {
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .fade-out {
            opacity: 0;
            transform: scale(1.03);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
    </style>
</head>
<body class="h-full font-sans text-gray-200 antialiased bg-plaza-dark flex items-center justify-center overflow-hidden selection:bg-plaza-gold selection:text-black">

    <!-- Cinematic Intro Container -->
    <div id="intro-container" class="animate-intro flex flex-col items-center text-center p-8 cursor-pointer" onclick="enterPlaza()">
        
        <!-- Logo Badge with Glow -->
        <div class="logo-glow w-24 h-24 rounded-2xl overflow-hidden border-2 border-plaza-gold/40 bg-black flex items-center justify-center mb-6 transition-transform duration-500 hover:scale-105">
            <img src="{% static 'plaza_logo.jpg' %}" alt="Plaza Logo" class="w-full h-full object-cover">
        </div>

        <!-- Welcome Text -->
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-gray-400 mb-2">Welcome to</p>
        
        <!-- Yellowtail Brand Typography -->
        <h1 class="font-yellowtail text-6xl md:text-7xl text-plaza-gold tracking-wide drop-shadow-md mb-6">
            Plaza
        </h1>

        <!-- Subtle Action Hint -->
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-plaza-panel border border-plaza-gold/20 text-xs font-medium text-gray-400 hover:text-plaza-gold transition-colors">
            <span>Loading experience</span>
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-plaza-gold animate-ping"></span>
        </div>
    </div>

    <script>
        function enterPlaza() {
            const container = document.getElementById('intro-container');
            container.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = "{% url 'home' %}";
            }, 550);
        }

        // Automatically boot into home after 2.2 seconds
        setTimeout(() => {
            const container = document.getElementById('intro-container');
            if (container && !container.classList.contains('fade-out')) {
                container.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = "{% url 'home' %}";
                }, 550);
            }
        }, 2200);
    </script>
</body>
</html>
